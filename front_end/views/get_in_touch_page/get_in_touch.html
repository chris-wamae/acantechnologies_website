    <body>
        <nav>
            <a href="/"><img class="nav_icon" src="../../public/acan_logo_filled.png"/></a>
            <span>Software development services</span>
            <div>
                <a href="/web-development/">Web development</a>

            <a href="/acan-innovations/">Acan innovations</a>

        <hr/>
        <h2>Just one more step</h2>
        <form class="get-in-touch-form">            
            <label>Topic <input type="text" class="topic_input" placeholder="Enter the type of software here eg. business website"></input></label>
            <label>Title <input type="text" class="title_input" placeholder="Enter a summary of what you'd like to know here"></input></label>
            <label>Message <textarea type="textarea" placeholder="Enter the details of what you'd like to know here, the more the better"></textarea></label>
            <div>What should we call you?</div>
    
            <label>Honorific <input type="text" placeholder="eg. Mrs"></input></label>
            <label>First name <input type="text" placeholder="Please enter your first name"></input></label>
            <label>Middle/Last name <input type="text" placeholder="Please enter your last name"></input></label>

            <div>How do we get back to you?</div>      
            
            <label>Email <input type="text" placeholder="Please enter your email here"></input></label>
            <label>Mobile number <input type="text" placeholder="Please enter your mobile no. here"></input></label>
            <label>Other <input type="text" placeholder="Please enter the details of an alternative contact method here"></input></label>
            <button type="submit">Submit</button>
        </form>
    </body>
